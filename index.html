<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(900px 420px at 8% -10%,color-mix(in srgb,var(--ac) 16%,transparent),transparent),radial-gradient(700px 420px at 100% 0,color-mix(in srgb,var(--ac2) 14%,transparent),transparent),var(--bg);background-attachment:fixed;min-height:100%}
body{margin:0 auto;max-width:1240px;padding:22px 18px 40px;color:var(--tx);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0;background:linear-gradient(90deg,var(--ac),var(--ac2));background-clip:text;-webkit-background-clip:text;color:transparent;width:max-content;max-width:100%}header{margin-bottom:12px}.mu,small{color:var(--mu)}

nav{display:flex;gap:6px;overflow-x:auto;background:var(--card);padding:5px;border-radius:999px;box-shadow:var(--sh);width:max-content;max-width:100%;margin-bottom:20px}nav button{border:0;background:transparent;color:var(--mu);font:inherit;font-weight:500;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}nav button:hover{color:var(--tx)}nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 40%,transparent)}

.gantt{overflow-x:auto;background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}.gw{position:relative}.gr{display:flex;height:40px;border-bottom:1px solid var(--ln);transition:background .15s}.gl{flex:0 0 180px;position:sticky;left:0;z-index:2;background:var(--card);padding:4px 8px;overflow:hidden;font-size:13px;line-height:1.2;cursor:pointer;border-right:1px solid var(--ln);display:flex;flex-direction:column;justify-content:center}.gl small{font-size:11px}.gt{position:relative;flex:none;background:repeating-linear-gradient(90deg,transparent 0 29px,var(--ln) 29px 30px)}.gh{background:none}.gd{position:absolute;top:0;height:100%;text-align:center;font-size:11px;padding-top:4px;color:var(--mu)}.gd.we{background:var(--we)}.gd em{display:block;font-style:normal;font-weight:600}.bar{position:absolute;top:9px;height:22px;border-radius:8px;cursor:pointer;opacity:1;background-image:linear-gradient(180deg,rgba(255,255,255,.28),transparent);box-shadow:0 3px 8px rgba(0,0,0,.18);transition:filter .15s,transform .15s}.bar:hover{filter:brightness(1.1);transform:scaleY(1.12)}.today{position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(var(--blocked),transparent);z-index:1;pointer-events:none}.gr:hover .gt{background-color:var(--we)}
.tw{overflow-x:auto}table{border-collapse:separate;border-spacing:0;width:100%;background:var(--card);border:0;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}th,td{text-align:left;border-bottom:1px solid var(--ln);font-size:14px}th{color:var(--mu);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:12px 10px}td{padding:6px 10px;transition:background .15s}tr:hover td{background:var(--we)}td input,td select,dialog input,dialog select,dialog textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px}td input,td select{border-color:transparent;background:transparent}td input:hover,td select:hover{background:var(--bg)}td input.n{width:90px}tfoot td,tr.tot td{font-weight:600}input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:1px}input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px}
dialog{border:0;border-radius:22px;background:var(--card);color:var(--tx);width:min(440px,92vw);padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .22s ease}dialog label{display:block;margin-bottom:10px;font-size:13px;color:var(--mu)}dialog::backdrop{background:rgba(10,14,25,.45);backdrop-filter:blur(5px)}.row{display:flex;gap:8px}.row>*{flex:1}.prog{height:10px;background:var(--we);border-radius:99px;overflow:hidden;margin:6px 0 14px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--done));transition:width .5s ease}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}.box{background:var(--card);border:0;border-radius:var(--r);box-shadow:var(--sh);padding:12px}.box h2{margin:.25em 0 0;font-size:26px;font-weight:700;letter-spacing:-.03em}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}#app>*{animation:rise .35s ease both}@media(max-width:700px){.board{grid-template-columns:repeat(4,80vw)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Extensões limitadas à lista de materiais. */
.materials{min-width:1430px}.materials .item{min-width:250px}.materials .linkfield{min-width:190px}.materials small{display:block;max-width:310px;font-size:11px;margin:4px 0}.materials a{color:var(--ac)}.materials .price{white-space:nowrap}.notice{margin-bottom:14px}.notice p{margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
</style></head><body>
<header><h1>Braço Robótico · PBL IV</h1><p id="sync"></p></header><nav id="tabs"></nav><main id="app"></main><dialog id="dlg"></dialog>
<script>
const CFG={url:'https://vhociddntawzsfcxwzif.supabase.co',key:'sb_publishable_wV-5nBzfISTtO6UjrK_HFA_jjsZDvkc'};
const $=s=>document.querySelector(s),dlg=$('#dlg');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const dn=s=>Math.round(Date.parse(s+'T00:00:00Z')/864e5),uid=()=>Math.random().toString(36).slice(2,9);
const ST=[['todo','A fazer'],['doing','Em andamento'],['blocked','Bloqueado'],['done','Concluído']];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0),fmt=s=>s?s.slice(8)+'/'+s.slice(5,7):'—';
const KEY='pbl4-tracker',MAT_VERSION=3;
let S,tab='kanban',tm;
/* Preços de referência estáticos, sem frete. Links das páginas consultadas.
   Fixadores M2,5 cadastrados individualmente, sem preços de kits.
   Valores não são atualizados automaticamente pelas lojas. */
function materials(){
 const data=[
 ['nano','Arduino Nano V3 ATmega328P, Mini USB com cabo',1,36.42,1,'Usinainfo','https://www.usinainfo.com.br/placas-arduino-compativel/placa-nano-v3-compativel-arduino-cabo-usb-3630.html','Preço Pix/boleto.'],
 ['servo','Micro servomotor SG90 9 g, posição 180° (N)',4,16.46,1,'Usinainfo','https://www.usinainfo.com.br/servo-motores/micro-servo-motor-9g-sg90-180-16kgfcm-de-posicao-2299.html','Selecionar versão 180° (N), não rotação contínua.'],
 ['female','Barra de pinos fêmea 180°, 1×40',1,3.91,1,'Fornell','https://www.fornell.com.br/produtos/barra-de-pinos-femea-1x40-180-sku12658/','Confirmar passo de 2,54 mm antes da compra.'],
 ['long','Barra de pinos macho longos 20 mm, 180°, 1×40',1,2.25,1,'Saravati','https://www.saravati.com.br/barra-de-pinos-1x40-vias-20mm-180-graus-passo-2-54mm.html','Passo 2,54 mm. Preço Pix/boleto.'],
 ['angle','Barra de pinos macho 90°, 1×40, passo 2,54 mm',1,19.90,10,'Vida de Silício','https://vidadesilicio.com.br/produto/kit-10x-barra-de-pinos-macho-1x40-90-graus/','Compra de 1 kit com 10 barras; 9 sobressalentes.'],
 ['borne','Borne KRE KF-301 3T, 3 vias',1,1.07,1,'Baú da Eletrônica','https://www.baudaeletronica.com.br/acessorios/conectores','Link do catálogo. Confirmar passo de 5 mm. Preço Pix.'],
 ['pcb','Placa de fenolite cobreada 100×100 mm, face simples',1,11.57,1,'Odison Eletrônica','https://www.odisoneletronica.com.br/produtos/placa-de-fenolite-10x10/','Placa virgem cobreada, não perfurada.'],
 ...[[6,9],[8,12],[10,3],[12,7],[20,4]].map(([len,q])=>['screw'+len,'Parafuso M2,5 × '+len+' mm',q,null,1,'','','Compra individual por medida. Preço unitário e loja a cotar.']),
 ['nut','Porca M2,5',10,null,1,'','','Compra individual. Preço unitário e loja a cotar.'],
 ['washer','Arruela lisa M2,5',10,null,1,'','','Compra individual. Preço unitário e loja a cotar.'],
 ['etch','Percloreto de ferro',1,null,1,'','','Mantido do projeto original. Preço a cotar.'],
 ['power','Fonte de alimentação',1,null,1,'','','Mantida do projeto original. Especificação e preço a definir.'],
 ['solder','Solda e consumíveis',1,null,1,'','','Mantidos do projeto original. Preço a cotar.']
 ];
 return data.map(([ref,item,qty,price,pack,store,url,note,included])=>({id:uid(),ref,item,qty,price,pack,store,url,note,included:included||'',est:included?0:price==null?0:Math.round(Math.ceil(qty/pack)*price*100)/100,real:0,by:''}));
}
function seed(){
 const m=[1,2,3].map(i=>({id:'m'+i,name:'Integrante '+i}));
 const T=[['Cadastrar equipe no grupo “PBL IV” (AVA)',0,1],['Comprar componentes eletrônicos',1,5],['Definir alimentação (fonte ou bateria)',1,4],['Receber impressão da faculdade e fotografar',5,6],['Transferência térmica',6,7],['Corrosão com percloreto',7,8],['Furação',8,9],['Soldagem e limpeza final',9,11],['Montar arquivo de fotos (TDE 2)',11,12],['Receber estrutura em acrílico e montar',10,16],['Programar servos (1 → 4)',12,18],['Sequência da tarefa de movimentação',16,22],['Roteiro e gravação do vídeo',22,26],['Entrega: .ino + link do YouTube',26,27]].map(([title,a,b])=>({id:uid(),title,owner:'',start:iso(a),end:iso(b),status:'todo',note:''}));
 const D=['Grupo “PBL IV” no AVA com todos os integrantes','TDE 2: arquivo com as 10 fotos das etapas da PCI','Sketch .ino com nomes completos nas primeiras linhas','Vídeo no YouTube com todos os integrantes'].map(title=>({id:uid(),title,due:'',owner:'',done:false}));
 return{members:m,tasks:T,budget:materials(),deliv:D,materialsVersion:MAT_VERSION};
}
function load(){try{const x=localStorage.getItem(KEY);if(x)return JSON.parse(x)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}ver++;clearTimeout(tm);if(ready()&&code){dirty=true;tm=setTimeout(push,500)}}
function commit(){save();render()}
const mname=id=>(S.members.find(m=>m.id===id)||{}).name||'Sem responsável';
const sel=(id,val,none)=>`<select id="${id}"><option value="">${none||'Sem responsável'}</option>${S.members.map(m=>`<option value="${m.id}" ${m.id===val?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`;
function kanban(){return `<div class="board">${ST.map(([k,l])=>{const c=S.tasks.filter(t=>t.status===k);return `<section class="col" ondragover="event.preventDefault()" ondrop="drop(event,'${k}')"><h3><i class="dot ${k}"></i>${l}<b>${c.length}</b></h3>${c.map(card).join('')}</section>`}).join('')}</div><button class="btn" onclick="editTask()">+ Nova tarefa</button>`}
const card=t=>`<article class="card" draggable="true" ondragstart="event.dataTransfer.setData('text',this.dataset.id)" data-id="${t.id}" onclick="editTask('${t.id}')"><strong>${esc(t.title)}</strong><small>${fmt(t.start)} → ${fmt(t.end)}</small><span class="chip">${esc(mname(t.owner))}</span></article>`;
function drop(e,k){e.preventDefault();const t=S.tasks.find(x=>x.id===e.dataTransfer.getData('text'));if(t&&t.status!==k){t.status=k;commit()}}
function editTask(id){const t=S.tasks.find(x=>x.id===id)||{id:'',title:'',owner:'',start:iso(0),end:iso(1),status:'todo',note:''};dlg.innerHTML=`<form method="dialog" onsubmit="return saveTask('${t.id}')"><label>Título<input id="f_t" value="${esc(t.title)}" required></label><label>Responsável${sel('f_o',t.owner)}</label><div class="row"><label>Início<input type="date" id="f_s" value="${t.start}" required></label><label>Fim<input type="date" id="f_e" value="${t.end}" required></label></div><label>Status<select id="f_st">${ST.map(([k,l])=>`<option value="${k}" ${k===t.status?'selected':''}>${l}</option>`).join('')}</select></label><label>Notas<textarea id="f_n" rows="3">${esc(t.note)}</textarea></label><div class="row"><button class="btn">Salvar</button>${t.id?`<button type="button" class="btn ghost" onclick="delTask('${t.id}')">Excluir</button>`:''}<button type="button" class="btn ghost" onclick="dlg.close()">Cancelar</button></div></form>`;dlg.showModal()}
function saveTask(id){let t=S.tasks.find(x=>x.id===id);if(!t){t={id:uid()};S.tasks.push(t)}let s=$('#f_s').value,e=$('#f_e').value;if(e<s)[s,e]=[e,s];Object.assign(t,{title:$('#f_t').value.trim(),owner:$('#f_o').value,start:s,end:e,status:$('#f_st').value,note:$('#f_n').value});dlg.close();commit();return false}
function delTask(id){S.tasks=S.tasks.filter(t=>t.id!==id);dlg.close();commit()}
function gantt(){const T=S.tasks.filter(t=>t.start&&t.end).sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);if(!T.length)return '<p class="mu">Nenhuma tarefa com datas.</p>';const today=dn(iso(0)),a=Math.min(...T.map(t=>dn(t.start)),today),z=Math.max(...T.map(t=>dn(t.end)),today),W=30,n=z-a+1;let h='';for(let i=0;i<n;i++){const d=new Date((a+i)*864e5),D=d.getUTCDate();h+=`<div class="gd${[0,6].includes(d.getUTCDay())?' we':''}" style="left:${i*W}px;width:${W}px">${D}${D===1||i===0?`<em>${MES[d.getUTCMonth()]}</em>`:''}</div>`}const rows=T.map(t=>{const l=(dn(t.start)-a)*W,w=(dn(t.end)-dn(t.start)+1)*W;return `<div class="gr"><div class="gl" onclick="editTask('${t.id}')">${esc(t.title)}<small>${esc(mname(t.owner))}</small></div><div class="gt" style="width:${n*W}px"><div class="bar ${t.status}" style="left:${l}px;width:${w}px" title="${fmt(t.start)} → ${fmt(t.end)}" onclick="editTask('${t.id}')"></div></div></div>`}).join('');return `<p class="mu">Clique numa barra para editar. A linha vermelha marca hoje.</p><div class="gantt"><div class="gw" style="width:${180+n*W}px"><div class="gr"><div class="gl"></div><div class="gt gh" style="width:${n*W}px">${h}</div></div>${rows}<div class="today" style="left:${180+(today-a)*W+W/2}px"></div></div></div><p class="mu">${ST.map(([k,l])=>`<i class="dot ${k}"></i> ${l}`).join(' &nbsp; ')}</p>`}
/* Orçamento: estimado e real são totais da linha, como na versão original. */
function safeURL(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}}
function budget(){const sum=k=>S.budget.reduce((s,b)=>s+(+b[k]||0),0),e=sum('est'),r=sum('real'),n=S.members.length||1;return `<div class="grid"><div class="box"><small>Estimado</small><h2>${brl(e)}</h2></div><div class="box"><small>Gasto real</small><h2>${brl(r)}</h2></div><div class="box"><small>Diferença</small><h2>${brl(r-e)}</h2></div><div class="box"><small>Real por integrante</small><h2>${brl(r/n)}</h2></div></div>
<div class="box notice"><strong>Materiais e opções de compra online</strong><p class="mu">Preços de referência, sem frete, sujeitos a alteração. Preço anunciado = valor por unidade ou embalagem; estimado = total da linha. Cada medida de fixador possui preço, loja, link, gasto real e responsável independentes. Itens a cotar não entram no subtotal.</p><p class="mu">Sem folha de transferência e sem MDF. Fixadores M2,5 individuais, sem kit. Percloreto, fonte e consumíveis mantidos do projeto original, ainda sem cotação.</p>${S.materialsVersion!==MAT_VERSION?'<p><strong>Este projeto contém uma lista anterior.</strong> Use o botão abaixo para incorporar a pesquisa sem alterar tarefas, entregas ou equipe.</p><button class="btn" onclick="applyMaterials()">Atualizar lista de materiais</button>':''}</div>
<div class="tw"><table class="materials"><thead><tr><th>Item / especificação</th><th>Qtd necessária</th><th>Preço anunciado (R$)</th><th>Peças por embalagem</th><th>Estimado total (R$)</th><th>Real total (R$)</th><th>Loja e link</th><th>Comprado por</th><th></th></tr></thead><tbody>${S.budget.map(b=>{const u=safeURL(b.url);return `<tr><td class="item"><input aria-label="Material" value="${esc(b.item)}" onchange="bset('${b.id}','item',this.value)"><small>${esc(b.note||'')}</small></td><td><input aria-label="Quantidade necessária" class="n" type="number" min="0" value="${b.qty}" onchange="bset('${b.id}','qty',this.value)"></td><td class="price">${b.included?'Incluído no kit':`<input aria-label="Preço anunciado" class="n" type="number" min="0" step="0.01" value="${b.price==null?'':b.price}" placeholder="A cotar" onchange="bset('${b.id}','price',this.value)">`}</td><td><input aria-label="Peças por embalagem" class="n" type="number" min="1" step="1" value="${b.pack||1}" onchange="bset('${b.id}','pack',this.value)"></td><td><input aria-label="Estimado total" class="n" type="number" min="0" step="0.01" value="${b.est||0}" onchange="bset('${b.id}','est',this.value)"></td><td><input aria-label="Gasto real total" class="n" type="number" min="0" step="0.01" value="${b.real||0}" onchange="bset('${b.id}','real',this.value)"></td><td class="linkfield"><input aria-label="Loja" value="${esc(b.store||'')}" placeholder="Loja" onchange="bset('${b.id}','store',this.value)"><input aria-label="Link da loja" type="url" value="${esc(b.url||'')}" placeholder="https://…" onchange="bset('${b.id}','url',this.value)">${u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Abrir oferta</a>`:'<small>Sem link cadastrado</small>'}</td><td><select aria-label="Comprado por" onchange="bset('${b.id}','by',this.value)"><option value="">—</option>${S.members.map(m=>`<option value="${m.id}" ${m.id===b.by?'selected':''}>${esc(m.name)}</option>`).join('')}</select></td><td><button class="btn ghost" aria-label="Excluir material" onclick="bdel('${b.id}')">✕</button></td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="4">Subtotal cotado, sem frete e itens a cotar</td><td>${brl(e)}</td><td>${brl(r)}</td><td colspan="3"></td></tr></tfoot></table></div><div class="actions"><button class="btn" onclick="badd()">+ Novo item</button><button class="btn ghost" onclick="exportBackup()">Baixar backup do projeto</button></div>`}
function bset(id,k,v){const b=S.budget.find(x=>x.id===id);if(!b)return;if(['item','by','store','url'].includes(k))b[k]=v;else if(k==='price')b[k]=v===''?null:Math.max(0,+v||0);else b[k]=Math.max(k==='pack'?1:0,+v||0);if(['qty','price','pack'].includes(k))b.est=b.included?0:Math.round(Math.ceil((+b.qty||0)/(+b.pack||1))*(+b.price||0)*100)/100;commit()}
function badd(){S.budget.push({id:uid(),item:'Novo item',qty:1,price:null,pack:1,est:0,real:0,by:'',store:'',url:'',note:''});commit()}
function bdel(id){S.budget=S.budget.filter(b=>b.id!==id);commit()}
function exportBackup(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='pbl4-backup-'+iso(0)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function applyMaterials(){
 if(!confirm('Atualizar os materiais com a pesquisa? Tarefas, equipe e entregas serão mantidas. Gastos e responsáveis dos itens reconhecidos serão preservados. Um backup local será criado.'))return;
 try{localStorage.setItem(KEY+'-backup-before-materials-'+Date.now(),JSON.stringify(S))}catch(e){alert('Não foi possível criar o backup local. Baixe um backup antes de continuar.');return}
 const old=S.budget, fresh=materials(),used=new Set();
 const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 function match(b){if(b.ref)return fresh.find(f=>f.ref===b.ref);const s=norm(b.item);if(/nano/.test(s))return fresh.find(f=>f.ref==='nano');if(/sg90/.test(s))return fresh.find(f=>f.ref==='servo');if(/femea/.test(s))return fresh.find(f=>f.ref==='female');if(/longos/.test(s))return fresh.find(f=>f.ref==='long');if(/90/.test(s)&&/pinos/.test(s))return fresh.find(f=>f.ref==='angle');if(/borne/.test(s))return fresh.find(f=>f.ref==='borne');if(/fenolite/.test(s))return fresh.find(f=>f.ref==='pcb');if(/percloreto/.test(s))return fresh.find(f=>f.ref==='etch');if(/fonte/.test(s))return fresh.find(f=>f.ref==='power');if(/solda/.test(s))return fresh.find(f=>f.ref==='solder');return null}
 const extra=[];old.forEach(b=>{const f=match(b);if(f&&!used.has(f.ref)){used.add(f.ref);f.id=b.id;f.real=+b.real||0;f.by=b.by||'';if(f.price==null)f.est=+b.est||0}else if(!f){const s=norm(b.item);if(b.ref==='kit'||(/parafuso/.test(s)&&(/kit|m3/.test(s)))){if(+b.real)extra.push({...b,item:'Gasto anterior com fixadores (revisar distribuição)',qty:0,est:0,price:null,url:'',store:'',included:'',note:'Registro financeiro anterior preservado; não integra a lista de compras individual.'});return;}if(!/mdf|transferencia/.test(s))extra.push(b);else if(+b.real)extra.push({...b,note:'Item removido da compra; mantido apenas para preservar gasto registrado.'})}else extra.push({...b,note:(b.note||'')+' Registro anterior preservado para revisão.'})});
 S.budget=[...fresh,...extra];S.materialsVersion=MAT_VERSION;commit();
}
function deliv(){const d=S.deliv.filter(x=>x.done).length,p=S.deliv.length?Math.round(100*d/S.deliv.length):0;return `<p><strong>${d} de ${S.deliv.length}</strong> entregas concluídas</p><div class="prog"><i style="width:${p}%"></i></div><div class="tw"><table><tr><th>Feito</th><th>Entrega</th><th>Prazo</th><th>Responsável</th><th></th></tr>${S.deliv.map(x=>`<tr><td><input type="checkbox" ${x.done?'checked':''} onchange="dset('${x.id}','done',this.checked)"></td><td><input value="${esc(x.title)}" onchange="dset('${x.id}','title',this.value)"></td><td><input type="date" value="${x.due}" onchange="dset('${x.id}','due',this.value)"></td><td><select onchange="dset('${x.id}','owner',this.value)"><option value="">—</option>${S.members.map(m=>`<option value="${m.id}" ${m.id===x.owner?'selected':''}>${esc(m.name)}</option>`).join('')}</select></td><td><button class="btn ghost" onclick="ddel('${x.id}')">✕</button></td></tr>`).join('')}</table></div><p><button class="btn" onclick="dadd()">+ Nova entrega</button></p>`}
function dset(id,k,v){S.deliv.find(x=>x.id===id)[k]=v;commit()}function dadd(){S.deliv.push({id:uid(),title:'Nova entrega',due:'',owner:'',done:false});commit()}function ddel(id){S.deliv=S.deliv.filter(x=>x.id!==id);commit()}
function team(){return `<div class="grid">${S.members.map(m=>{const t=S.tasks.filter(x=>x.owner===m.id),dn_=t.filter(x=>x.status==='done').length,g=S.budget.filter(b=>b.by===m.id).reduce((s,b)=>s+(+b.real||0),0);return `<div class="box"><input value="${esc(m.name)}" onchange="mren('${m.id}',this.value)" style="width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px"><p>Tarefas: <strong>${t.length}</strong> (${dn_} concluídas)<br>Já gastou: <strong>${brl(g)}</strong></p>${S.members.length>1?`<button class="btn ghost" onclick="mdel('${m.id}')">Remover</button>`:''}</div>`}).join('')}</div><button class="btn" onclick="madd()" ${S.members.length>=3?'disabled':''}>+ Integrante</button> <small>Equipes de até 3 alunos.</small>`}
function mren(id,v){S.members.find(m=>m.id===id).name=v||'Sem nome';commit()}function madd(){if(S.members.length>=3)return;S.members.push({id:uid(),name:'Integrante '+(S.members.length+1)});commit()}function mdel(id){S.members=S.members.filter(m=>m.id!==id);for(const l of [S.tasks,S.deliv])l.forEach(x=>{if(x.owner===id)x.owner=''});S.budget.forEach(b=>{if(b.by===id)b.by=''});commit()}
const TABS=[['kanban','Kanban',kanban],['gantt','Cronograma',gantt],['budget','Orçamento',budget],['deliv','Entregas',deliv],['team','Equipe',team]];
function render(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');$('#app').innerHTML=TABS.find(t=>t[0]===tab)[2]()}
const ready=()=>/^https:\/\//.test(CFG.url)&&CFG.key.length>20;let code='',dirty=false,ver=0;const setSync=m=>{$('#sync').textContent=m};
async function rpc(fn,body){const r=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key,Authorization:'Bearer '+CFG.key},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null}
function push(){if(!ready()||!code)return;const v=ver;rpc('set_state',{p_code:code,p_data:{json:JSON.stringify(S)}}).then(()=>{if(v===ver)dirty=false;setSync('Sincronizado com a equipe')}).catch(()=>setSync('Sem conexão: salvo só neste navegador'))}
async function pull(){if(!ready()||!code)return;if(dirty){push();return}try{const r=await rpc('get_state',{p_code:code});if(!r||!r.json){push();return}setSync('Sincronizado com a equipe');if(r.json===JSON.stringify(S))return;const a=document.activeElement;if(dlg.open||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))return;S=JSON.parse(r.json);try{localStorage.setItem(KEY,r.json)}catch(e){}render()}catch(e){setSync('Sem conexão: salvo só neste navegador')}}
function initCode(){try{code=decodeURIComponent(location.hash.slice(1))||localStorage.getItem('pbl4-code')||''}catch(e){code=''}if(ready()&&code.length<8)code=(prompt('Código do projeto (mínimo 8 caracteres). Toda a equipe usa o mesmo código:')||'').trim();if(code.length>=8){try{localStorage.setItem('pbl4-code',code)}catch(e){}try{history.replaceState(null,'','#'+encodeURIComponent(code))}catch(e){}}else code=''}
S=load();render();initCode();setSync(!ready()?'Modo local: configure o Supabase para sincronizar':code?'Conectando…':'Sem código do projeto: salvo só neste navegador');pull();setInterval(pull,4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script></body></html>
